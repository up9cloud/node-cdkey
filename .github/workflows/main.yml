on:
  push:
    branches: [ master ]
    tags:
      - '*'
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_path: ${{ steps.build-artifacts.outputs.paths }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist
            lib
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 22, 20, 18, 16, 14, 12, 10, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      - run: |
          rm -f package.json package-lock.json
          if [ "${{ matrix.node-version }}" -ge 20 ]; then
            npm install mocha
            npm install chai
          elif [ "${{ matrix.node-version }}" -ge 18 ]; then
            npm install mocha
            npm install chai@4
          elif [ "${{ matrix.node-version }}" -ge 12 ]; then
            npm install mocha@9
            npm install chai@4
          else
            npm install mocha@6
            npm install chai@4
          fi
          if [ "${{ matrix.node-version }}" -ge 16 ]; then
            cat package.json
          fi
          npx mocha
  # https://docs.github.com/en/actions/tutorials/publish-packages/publish-nodejs-packages#publishing-packages-to-the-npm-registry
  # https://docs.npmjs.com/trusted-publishers#github-actions-configuration
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'up9cloud/node-cdkey'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm publish
